name: Ping URLs Every 30 Minutes

on:
  schedule:
    - cron: "*/30 * * * *" # Every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping URL 1
        run: |
          curl -L --fail https://appels-d-offres.streamlit.app/

      - name: Ping URL 2
        run: |
          curl -L --fail https://appels-d-offres-dashbord.streamlit.app/

      - name: Ping URL 3
        run: |
          curl -L --fail https://countskills-dashboard.streamlit.app/
